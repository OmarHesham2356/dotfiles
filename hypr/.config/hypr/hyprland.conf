source = ~/.cache/wal/colors-hyprland.conf

env = XCURSOR_THEME, Bibata-Modern-Ice
env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24
env = GTK_THEME, Adwaita-dark

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba($color5cc) rgba($color4cc) rgba($color2cc)
    col.inactive_border = rgba($color800)
    layout = dwindle
    hover_icon_on_border = true
}

decoration {
    rounding = 0
    active_opacity = 0.92
    inactive_opacity = 0.8
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 12
        passes = 3
        ignore_opacity = false
        xray = true
        noise = 0.03
        contrast = 0.65
        brightness = 1.0
        vibrancy = 0.35
        vibrancy_darkness = 0.0
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        scale = 0.98
        color = rgba($color077)
        offset = 0 4
    }
}

animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 0, 0, 1, 1
    animation = windows, 1, 6, wind
    animation = windowsIn, 1, 6, winIn
    animation = windowsOut, 1, 6, winOut
    animation = windowsMove, 1, 6, wind
    animation = fade, 1, 6, liner
    animation = fadeDim, 1, 6, liner
    animation = border, 1, 6, liner
    animation = borderangle, 1, 6, liner
    animation = workspaces, 1, 6, wind
}

input {
    kb_layout = us,ara
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0
    numlock_by_default = true
    force_no_accel = false
    float_switch_override_focus = 2
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        scroll_factor = 1.0
    }
}

dwindle {
    preserve_split = true
    force_split = 2
    special_scale_factor = 0.8
    split_width_multiplier = 1.0
    smart_split = false
    smart_resizing = false
    permanent_direction_override = true
}

master {
    special_scale_factor = 0.8
    mfact = 0.55
    orientation = center
    new_on_top = true
    allow_small_split = true
    drop_at_cursor = false
}

misc {
    disable_autoreload = false
    focus_on_activate = true
    always_follow_on_dnd = true
    animate_mouse_windowdragging = false
    mouse_move_enables_dpms = true
    key_press_enables_dpms = false
    disable_hyprland_logo = true
    vrr = 0
}

binds {
    allow_workspace_cycles = true
    ignore_group_lock = false
    workspace_back_and_forth = true
    movefocus_cycles_fullscreen = false
    scroll_event_delay = 300
}

debug {
    disable_logs = true
    disable_time = false
}

monitor = DP-1, 1920x1080@120, -1920x0, 1
monitor = eDP-1, 1920x1080@120, 0x0, 1
monitor = HDMI-A-1, preferred, auto, 1
monitor = , preferred, auto, 1

workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:eDP-1
workspace = 7, monitor:eDP-1
workspace = 8, monitor:eDP-1
workspace = 9, monitor:eDP-1
workspace = 10, monitor:eDP-1

# Core
bind = SUPER, Q, exec, kitty
bind = SUPER, C, killactive
bind = SUPER, M, exit
bind = SUPER, E, exec, kitty -e yazi
bind = SUPER, F, fullscreen
bind = SUPER, Space, togglefloating
bind = SUPER, P, pseudo
bind = SUPER, J, layoutmsg, togglesplit

# Apps
bind = SUPER, R, exec, rofi -show drun
bind = SUPER SHIFT, R, exec, pill-launcher
bind = SUPER, L, exec, hyprlock
bind = SUPER, V, exec, cliphist list | rofi -dmenu -p 'Clipboard' | cliphist decode | wl-copy
bind = SUPER SHIFT, A, exec, audio-switcher
bind = SUPER, A, exec, swaync-client -t
bind = SUPER, Tab, workspace, previous
bind = SUPER, S, exec, hyprshot -m region
bind = SUPER SHIFT, S, exec, hyprshot -m window
bind = SUPER, B, exec, killall waybar; sleep 0.5; waybar &
bind = SUPER, grave, exec, scratchpad
bind = SUPER, Print, exec, record-screen
bind = SUPER SHIFT, W, exec, web-search
bind = SUPER SHIFT, N, exec, kitty --class=nmtui -e nmtui
bind = SUPER SHIFT, O, exec, quick-notes
bind = SUPER, period, exec, rofi -show emoji
bind = SUPER SHIFT, P, exec, hyprpicker -a

# Group
bind = SUPER SHIFT, V, moveintogroup, l
bind = SUPER, N, togglegroup
bind = SUPER SHIFT, C, moveoutofgroup

# Focus
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Swap
bind = SUPER SHIFT, left, swapwindow, l
bind = SUPER SHIFT, right, swapwindow, r
bind = SUPER SHIFT, up, swapwindow, u
bind = SUPER SHIFT, down, swapwindow, d

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move to workspaces
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , Print, exec, hyprshot -m output
bindl = SHIFT, Print, exec, hyprshot -m region
bindl = CTRL, Print, exec, hyprshot -m window

windowrule = workspace 5 on, match:class ^(vesktop)$
windowrule = workspace 3 on, match:class ^(obsidian)$
windowrule = float on, match:class ^(copyq)$
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(org.gnome.Calculator)$
windowrule = float on, match:class ^(org.gnome.Nautilus)$
windowrule = float on, match:class ^(thunar)$
windowrule = float on, match:class ^(imv)$
windowrule = float on, match:class ^(mpv)$
windowrule = workspace 2 on, match:title ^(.* — Mozilla Firefox)$
windowrule = workspace 2 on, match:title ^(zen-beta — Zen Browser)$
windowrule = float on, pin on, match:title ^(picture in picture)$
windowrule = workspace special:scratchpad on, float on, match:class ^(scratchpad)$
windowrule = float on, match:class ^(notes)$
windowrule = float on, match:class ^(nmtui)$

layerrule = no_anim on, match:namespace waybar
layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace swaync-control-center
layerrule = ignore_alpha 0.1, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.1, match:namespace swaync-notification-window
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0.1, match:namespace rofi
layerrule = order 9999, match:namespace copyq

exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = awww-daemon
exec-once = waybar &
exec-once = swaync
exec-once = wl-paste --watch cliphist store
exec-once = hypridle
exec-once = blueman-applet