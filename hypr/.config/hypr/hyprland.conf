

# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua

autogenerated = 1

$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = hyprlauncher

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu

# Floating terminal (hover term)
windowrulev2 = float,class:^(hover-term)$
windowrulev2 = center,class:^(hover-term)$
windowrulev2 = size 95% 60%,class:^(hover-term)$
windowrulev2 = pin,class:^(hover-term)$

# Notes and project terminals
windowrulev2 = float,class:^(notes)$
windowrulev2 = size 85% 80%,class:^(notes)$
windowrulev2 = center,class:^(notes)$

windowrulev2 = float,class:^(project-nvim)$
windowrulev2 = size 90% 85%,class:^(project-nvim)$
windowrulev2 = center,class:^(project-nvim)$

windowrulev2 = float,class:^(project-term)$
windowrulev2 = size 85% 70%,class:^(project-term)$
windowrulev2 = center,class:^(project-term)$

windowrulev2 = float,class:^(nmtui)$
windowrulev2 = size 50% 70%,class:^(nmtui)$
windowrulev2 = center,class:^(nmtui)$
