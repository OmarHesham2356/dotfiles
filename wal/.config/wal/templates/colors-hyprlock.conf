# Pywal colors for hyprlock
#
# Hyprlock still uses the hyprlang (.conf) config language, so unlike
# hyprland.lua it cannot compute colors in Lua. Each entry is therefore emitted
# as a complete rgb(r,g,b) value rather than bare hex.

$bg = rgb({background.rgb})
$fg = rgb({foreground.rgb})
$c0 = rgb({color0.rgb})
$c1 = rgb({color1.rgb})
$c2 = rgb({color2.rgb})
$c3 = rgb({color3.rgb})
$c4 = rgb({color4.rgb})
$c5 = rgb({color5.rgb})
$c6 = rgb({color6.rgb})
$c7 = rgb({color7.rgb})
$c8 = rgb({color8.rgb})
$c9 = rgb({color9.rgb})
$c10 = rgb({color10.rgb})
$c11 = rgb({color11.rgb})
$c12 = rgb({color12.rgb})
$c13 = rgb({color13.rgb})
$c14 = rgb({color14.rgb})
$c15 = rgb({color15.rgb})
