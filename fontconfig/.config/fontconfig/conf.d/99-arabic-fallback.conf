<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<!-- Prefer a dedicated Arabic font for Arabic text when a page requests a
     generic or Latin-only font. Explicitly requested fonts, including Amiri,
     are left untouched. -->
<fontconfig>
 <match target="pattern">
  <test compare="contains" name="lang">
   <string>ar</string>
  </test>
  <edit binding="weak" mode="prepend" name="family">
   <string>Noto Naskh Arabic</string>
  </edit>
 </match>
 <match target="pattern">
  <test compare="contains" name="lang">
   <string>ar</string>
  </test>
  <test compare="eq" name="family">
   <string>sans-serif</string>
  </test>
  <edit binding="strong" mode="assign" name="family">
   <string>Noto Naskh Arabic</string>
  </edit>
 </match>
 <match target="pattern">
  <test compare="contains" name="lang">
   <string>ar</string>
  </test>
  <test compare="eq" name="family">
   <string>serif</string>
  </test>
  <edit binding="strong" mode="assign" name="family">
   <string>Noto Naskh Arabic</string>
  </edit>
 </match>
 <match target="pattern">
  <test compare="contains" name="lang">
   <string>ar</string>
  </test>
  <test compare="eq" name="family">
   <string>system-ui</string>
  </test>
  <edit binding="strong" mode="assign" name="family">
   <string>Noto Naskh Arabic</string>
  </edit>
 </match>
 <match target="pattern">
  <test compare="contains" name="lang">
   <string>ar</string>
  </test>
  <test compare="eq" name="family">
   <string>monospace</string>
  </test>
  <edit binding="strong" mode="assign" name="family">
   <string>Noto Naskh Arabic</string>
  </edit>
 </match>
 <match target="pattern">
  <test compare="contains" name="lang">
   <string>ar</string>
  </test>
  <test compare="eq" name="family">
   <string>Arial</string>
  </test>
  <edit binding="strong" mode="assign" name="family">
   <string>Noto Naskh Arabic</string>
  </edit>
 </match>
 <match target="pattern">
  <test compare="contains" name="lang">
   <string>ar</string>
  </test>
  <test compare="eq" name="family">
   <string>Times New Roman</string>
  </test>
  <edit binding="strong" mode="assign" name="family">
   <string>Noto Naskh Arabic</string>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>vbgr</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>vrgb</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>bgr</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>rgb</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>none</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintfull</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>none</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintmedium</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>none</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>none</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>false</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintnone</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
</fontconfig>
